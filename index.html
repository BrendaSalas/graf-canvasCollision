<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colisiones 2D | Gatitos de noche</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: "Courier New", monospace;
            background: #080d25;
        }

        #canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            image-rendering: pixelated;
            touch-action: manipulation;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2;
            width: 100%;
            padding: 16px 12px;
            text-align: center;
            pointer-events: none;
            color: #ffffff;
            text-shadow: 2px 2px 4px #080d25;
        }

        h1 {
            margin: 0 0 6px;
            font-size: clamp(20px, 4vw, 34px);
        }

        p {
            margin: 5px;
            font-size: clamp(11px, 2vw, 15px);
        }

        #marcador {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 16px;
            border: 2px solid #a9c7ff;
            border-radius: 8px;
            background: rgba(8, 13, 37, 0.85);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <header>
        <h1>🐈 GATITOS EN LA CIUDAD 🌙</h1>
        <p>¡Atrapa a los gatos haciendo clic sobre ellos!</p>

        <div id="marcador">
            GATOS ATRAPADOS: <span id="puntos">0</span>
        </div>
    </header>

    <script src="colision.js"></script>
</body>
</html>
